###
#Проверка кода 
###
name: MyPj4D
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: 00 23 * * *
jobs:
  semgrep:
#    needs: [ Linter, analyze ] 
    name: semgrep/ci
    runs-on: ubuntu-latest
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: returntocorp/semgrep
    steps:
    - uses: actions/checkout@v4
    - run: semgrep ci

  
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

      
  Linter:  # проверка кода на соответсвие правилам.
     name: Lint
     runs-on: ubuntu-latest

     permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

     steps:
          - uses: actions/checkout@v4
            with:
            # super-linter needs the full git history to get the
            # list of files that changed across commits
              fetch-depth: 0
  
            name: Super-linter
          - uses: super-linter/super-linter@v7.3.0 # x-release-please-version
            env:
                VALIDATE_ALL_CODEBASE: false
                DEFAULT_BRANCH: "master"
                # To report GitHub Actions status checks
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            continue-on-error: true # не прерываем на ошибке. 
        
###
#Проверка 
###
  Gitleaks:
      needs: Checkout
      name: gitleaks
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4
            with:
              fetch-depth: 0
          - uses: gitleaks/gitleaks-action@v2
            id: gitleaks
            env:
              #GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
              #GITLEAKS_ENABLE_COMMENTS: false
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            continue-on-error: true
          - name: Create Gitleaks report
            run: |
              mkdir -p gitleaks-report
              echo "${{ steps.gitleaks.outputs.report }}" > gitleaks-report/report.json
          - name: Split report into smaller parts
            run: |
              split -b 1M gitleaks-report/report.json gitleaks-report/part_ --additional-suffix=.json
            #
          - name: Upload Gitleaks report parts as artifacts
            uses: actions/upload-artifact@v4
            with:
              name: gitleaks-report
              path: gitleaks-report/part_*
 
  SonarQB:
      needs: analyze
      name: SonarQube
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@v4
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    
  Checkout:
      needs: semgrep
      name: Checkout
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4.2.2


  
  zap_scan: # https://github.com/zaproxy/action-baseline#rules_file_name
    needs: analyze
    runs-on: ubuntu-latest
    name: Scan the webapplication
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'https://www.zaproxy.org'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

  Deploy_test:
      needs: [ zap_scan, Gitleaks, Linter ]
      #needs: [semgrep, CodeQL, zap_scan]
      name: Deploy Test    
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      runs-on: ubuntu-latest
      environment: test
      steps:
        - name: Deploy Test
          run: echo "Deploy Test"

  Deploy_release:
      needs: Deploy_test
      name: Deploy release
      runs-on: ubuntu-latest
      timeout-minutes: 60
      environment: release
      steps: 
         - name: Deploy release
           run: echo "Deploy release"
          

